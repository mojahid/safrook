<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safrook • Browser Data Recovery</title><style>body{font:17px system-ui;background:#06182d;color:white;max-width:660px;margin:40px auto;padding:20px;line-height:1.5}button{background:#ffc23d;color:#06182d;border:0;border-radius:12px;padding:15px;font-weight:bold;font-size:17px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b2747;padding:16px;border-radius:12px}</style><h1>⚽ Safrook data backup</h1><p>This page reads <b>only this browser’s</b> saved Safrook cache. It does not contact or change the game database. Open it in the same normal phone browser that shows September 30, 16/20.</p><div id="summary"></div><button id="download">Download this browser’s backup</button><p id="message"></p><script>
const raw=localStorage.getItem('safrook_cache');let data;try{data=JSON.parse(raw)}catch(e){}const el=document.getElementById('summary');
if(data){const g=data.game||{};el.textContent=`Saved game: ${g.date||'unknown'} • Capacity: ${g.capacity||'unknown'} • Guests: ${(data.guestRecords||[]).length} • Members: ${(data.safrookMembers||[]).length}`;}else{el.textContent='No saved Safrook data found in this browser. Try the normal phone browser, not Incognito.';document.getElementById('download').disabled=true}
document.getElementById('download').onclick=()=>{if(!raw)return;const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),origin:location.origin,cache:JSON.parse(raw)},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='safrook-phone-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.getElementById('message').textContent='Backup downloaded. Keep it private: it may contain member PINs and player details.'};
</script></html>
