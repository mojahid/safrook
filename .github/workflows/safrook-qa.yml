name: Safrook QA (isolated)
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload browser report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safrook-qa-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
